<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Quality Analyzer</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Results Section */
        #results {
            margin-top: 2rem;
            display: none;
        }

        .section-title {
            border-bottom: 2px solid var(--border);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            color: var(--primary);
        }

        .rating-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 2rem;
        }

        .rating-item {
            padding: 10px;
            background: #f1f5f9;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
        }

        .rating-val { font-weight: bold; display: block; }
        .Strong { color: var(--success); }
        .Moderate { color: var(--warning); }
        .Weak { color: var(--danger); }

        .feedback-box {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
        }

        .works { background: #f0fdf4; border-left: 5px solid var(--success); }
        .weakness { background: #fef2f2; border-left: 5px solid var(--danger); }
        .improved { background: #eff6ff; border-left: 5px solid var(--primary); white-space: pre-wrap; }

        h3 { margin-top: 0; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Prompt Quality Analyzer</h1>
        <p>Enter your prompt below to see how it can be improved.</p>
    </header>

    <div class="card">
        <textarea id="promptInput" placeholder="e.g., Write an email about a project update..."></textarea>
        <button onclick="analyzePrompt()">Analyze Prompt</button>
    </div>

    <div id="results" class="card">
        <h2 class="section-title">Analysis Results</h2>
        
        <div class="rating-grid" id="ratingGrid">
            <!-- Ratings injected here -->
        </div>

        <div class="feedback-box works">
            <h3>✅ What Works</h3>
            <ul id="worksList"></ul>
        </div>

        <div class="feedback-box weakness">
            <h3>⚠️ Areas for Improvement</h3>
            <ul id="weaknessList"></ul>
        </div>

        <div class="feedback-box">
            <h3>💡 Suggestions</h3>
            <p id="suggestionsText"></p>
        </div>

        <div class="feedback-box improved">
            <h3>✨ Improved Prompt</h3>
            <p id="improvedPrompt"></p>
        </div>
    </div>
</div>

<script>
    /* --- JAVASCRIPT LOGIC --- */

    function analyzePrompt() {
        const input = document.getElementById('promptInput').value.trim();
        if (!input) {
            alert("Please enter a prompt first!");
            return;
        }

        // 1. Rule-based Evaluation Logic
        const analysis = {
            role: /as a|act as|expert|professional|writer|tutor/i.test(input),
            specificity: input.length > 60,
            constraints: /limit|don't|avoid|only|maximum|words|tone/i.test(input),
            format: /list|bullet|table|markdown|outline|json|format/i.test(input),
            clarity: !/(stuff|things|something|maybe|whatever)/i.test(input) && input.length > 20
        };

        // 2. Map Boolean checks to Ratings
        const scores = {
            "Role Assignment": analysis.role ? "Strong" : "Weak",
            "Specificity": analysis.specificity ? "Strong" : "Moderate",
            "Constraints": analysis.constraints ? "Strong" : "Weak",
            "Output Format": analysis.format ? "Strong" : "Weak",
            "Clarity": analysis.clarity ? "Strong" : "Moderate"
        };

        // 3. Generate Feedback Lists
        let works = [];
        let weaknesses = [];
        let suggestions = [];

        if (analysis.role) works.push("You defined a specific persona or role.");
        else weaknesses.push("Missing a persona (e.g., 'Act as a Marketing Expert').");

        if (analysis.specificity) works.push("The prompt has a good amount of detail.");
        else weaknesses.push("The prompt is too short and vague.");

        if (analysis.format) works.push("You requested a specific output format.");
        else suggestions.push("Try asking for a specific format like a 'bulleted list' or 'table'.");

        if (!analysis.constraints) {
            weaknesses.push("Missing constraints (word count, tone, or style).");
            suggestions.push("Define what the AI should avoid or focus on.");
        }

        // 4. Generate Improved Prompt
        let improved = input;
        if (!analysis.role) improved = "Act as an experienced professional. " + improved;
        if (!analysis.constraints) improved += "\n\nConstraints: Ensure the tone is professional and concise. Avoid unnecessary jargon.";
        if (!analysis.format) improved += "\n\nFormat: Present the final response in a clear, structured format using headers or bullet points.";

        // 5. Update UI
        displayResults(scores, works, weaknesses, suggestions, improved);
    }

    function displayResults(scores, works, weaknesses, suggestions, improved) {
        document.getElementById('results').style.display = 'block';
        
        // Render Ratings
        const grid = document.getElementById('ratingGrid');
        grid.innerHTML = '';
        for (const [key, val] of Object.entries(scores)) {
            grid.innerHTML += `<div class="rating-item">
                <span>${key}</span>
                <span class="rating-val ${val}">${val}</span>
            </div>`;
        }

        // Render Lists
        updateList('worksList', works);
        updateList('weaknessList', weaknesses);
        
        document.getElementById('suggestionsText').innerText = suggestions.length > 0 
            ? suggestions.join(" ") 
            : "Your prompt is solid! Consider adding more context if the output isn't quite right.";
        
        document.getElementById('improvedPrompt').innerText = improved;

        // Scroll to results
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }

    function updateList(id, items) {
        const list = document.getElementById(id);
        list.innerHTML = '';
        if (items.length === 0) {
            list.innerHTML = '<li>None identified.</li>';
        } else {
            items.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                list.appendChild(li);
            });
        }
    }
</script>

</body>
</html>
